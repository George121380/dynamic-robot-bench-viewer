<text id="text-057" x="1792.5" y="591" font-size="24" fill="#2D7C76" font-weight="400" text-anchor="middle" font-style="italic">pᵢ ∈ R⁵¹²</text>
<path d="M1610 598 H1720" fill="none" stroke="#2D7C76" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#2D7C76)"/>
<text id="text-058" x="1385" y="689" font-size="23" fill="#3A6387" font-weight="600" text-anchor="middle">99,072 trainable parameters</text>
<text id="text-059" x="1792" y="673" font-size="17" fill="#66747D" font-weight="400" text-anchor="middle">Next: LayerNorm</text>
<text id="text-060" x="1792" y="698" font-size="17" fill="#66747D" font-weight="400" text-anchor="middle">→ fusion keys / values</text>
<path d="M55 731 H1865" fill="none" stroke="#CCD5DC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text id="text-061" x="55" y="775" font-size="24" fill="#2D7C76" font-weight="600" text-anchor="start">Exact feature construction</text>
<text id="text-062" x="55" y="821" font-size="23" fill="#20313E" font-weight="400" text-anchor="start" font-style="italic">Effective validity: m̃ᵢ(τ) = mᵢ(τ) ∧ mᵢ(0)</text>
<text id="text-063" x="55" y="863" font-size="22" fill="#20313E" font-weight="400" text-anchor="start" font-style="italic">fᵢ(τ) = where(m̃ᵢ(τ), [xᵢ(0)/0.5, Δxᵢ(τ)/0.05, τ, 1], 0)</text>
<text id="text-064" x="55" y="904" font-size="23" fill="#20313E" font-weight="400" text-anchor="start" font-style="italic">Δxᵢ(τ) = xᵢ(τ) − xᵢ(0)</text>
<text id="text-065" x="55" y="945" font-size="19" fill="#66747D" font-weight="400" text-anchor="start">Positions in meters; time in seconds. Validity distinguishes missing data from zero motion.</text>
<text id="text-066" x="1040" y="775" font-size="24" fill="#3A6387" font-weight="600" text-anchor="start">Shared across points; time is flattened first</text>
<rect x="1040" y="806" width="180" height="68" rx="8" stroke="#2D7C76" fill="#F4FAF8" stroke-width="1.6"/>
<text id="text-067" x="1130" y="849" font-size="25" fill="#2D7C76" font-weight="600" text-anchor="middle">K × 128</text>
<rect x="1300" y="806" width="235" height="68" rx="8" stroke="#3A6387" fill="#F6F9FC" stroke-width="1.6"/>
<text id="text-068" x="1417.5" y="849" font-size="22" fill="#3A6387" font-weight="600" text-anchor="middle">Same MLP weights</text>
<rect x="1615" y="806" width="250" height="68" rx="8" stroke="#2D7C76" fill="#F4FAF8" stroke-width="1.6"/>
<text id="text-069" x="1740" y="849" font-size="24" fill="#2D7C76" font-weight="600" text-anchor="middle">K × 512 tokens</text>
<path d="M1220 840 H1300" fill="none" stroke="#3A6387" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#3A6387)"/>
<path d="M1535 840 H1615" fill="none" stroke="#3A6387" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#3A6387)"/>
<text id="text-070" x="1040" y="911" font-size="20" fill="#66747D" font-weight="400" text-anchor="start">No cross-point mixing or point-ID embedding inside the MLP.</text>
<text id="text-071" x="1040" y="947" font-size="20" fill="#66747D" font-weight="400" text-anchor="start">Current-invalid tracks are excluded before fusion attention.</text>
<path d="M55 992 H1865" fill="none" stroke="#CCD5DC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text id="text-072" x="55" y="1033" font-size="22" fill="#20313E" font-weight="400" text-anchor="start">Stationary control: zero only past displacement; preserve current anchors, timestamps and validity.</text>
<text id="text-073" x="1865" y="1063" font-size="16" fill="#66747D" font-weight="400" text-anchor="end">Current setting: H = 16, K = 16, token width = 512 · input trajectory is schematic</text>
</g></svg>
