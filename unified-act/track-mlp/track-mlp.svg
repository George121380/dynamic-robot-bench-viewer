<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Inside the Track MLP</title><desc>For each point, concatenate eight features per valid history slot, zero invalid slots, flatten the ordered sixteen by eight matrix, and apply three shared linear layers with two ReLUs to produce one 512-dimensional token. Point identities do not mix inside the MLP.</desc><defs>
<marker id="3A6387" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#3A6387"/></marker>
<marker id="2D7C76" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#2D7C76"/></marker>
<marker id="A66E29" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#A66E29"/></marker>
<marker id="66747D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8Z" fill="#66747D"/></marker>
</defs><rect width="1920" height="1080" fill="white"/><g font-family="Arial,Helvetica,sans-serif">
<text id="text-000" x="55" y="61" font-size="36" fill="#20313E" font-weight="600" text-anchor="start">Inside the Track MLP</text>
<text id="text-001" x="55" y="102" font-size="24" fill="#66747D" font-weight="400" text-anchor="start">An ordered 16-frame 3D history becomes one 512-D token per point</text>
<text id="text-002" x="55" y="196" font-size="25" fill="#2D7C76" font-weight="600" text-anchor="start">1   One point history</text>
<text id="text-003" x="425" y="196" font-size="25" fill="#2D7C76" font-weight="600" text-anchor="start">2   Eight features per time slot</text>
<text id="text-004" x="1110" y="196" font-size="25" fill="#3A6387" font-weight="600" text-anchor="start">3   Flatten, then apply the shared MLP</text>
<rect x="55" y="240" width="300" height="410" rx="8" stroke="#2D7C76" fill="white" stroke-width="1.6"/>
<text id="text-005" x="205" y="277" font-size="23" fill="#2D7C76" font-weight="600" text-anchor="middle">Point i across time</text>
