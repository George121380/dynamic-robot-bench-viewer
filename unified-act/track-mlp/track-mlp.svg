<text id="text-052" x="1385" y="475" font-size="17" fill="#66747D" font-weight="400" text-anchor="middle">16,512 parameters</text>
<rect x="1330" y="511" width="110" height="30" rx="5" stroke="#A66E29" fill="#FFFCF7" stroke-width="1.6"/>
