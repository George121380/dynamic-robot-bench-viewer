<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#1c354b"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192c3b}.title{font-size:30px;font-weight:700}.section{font-size:21px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.math{font-family:Georgia,serif;font-style:italic}</style><text x="45" y="50" text-anchor="start" class="title">Unified ACT: shared observations, two task interfaces</text><text x="45" y="84" text-anchor="start" class="body" style="fill:#657480">One model family across garment folding, bowling and hook pull · model schema unified-act-v1</text><rect x="35" y="126" width="1030" height="652" rx="10" fill="#f5f8fa" stroke="#cdd7de"/><text x="60" y="163" text-anchor="start" class="section">(a) Shared causal observation backbone</text><rect x="65" y="205" width="195" height="136" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M66 241 H259" stroke="#3e6b91" stroke-opacity=".35"/><text x="162.5" y="230" text-anchor="middle" class="label" style="fill:#3e6b91">RGB observations</text><text x="162.5" y="270" text-anchor="middle" class="small">Current I₀: full grid</text><text x="162.5" y="294" text-anchor="middle" class="small">Past I₋H₊₁: pooled</text><text x="162.5" y="318" text-anchor="middle" class="small">Same causal timestamps</text><rect x="305" y="205" width="190" height="136" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M306 241 H494" stroke="#3e6b91" stroke-opacity=".35"/><text x="400.0" y="230" text-anchor="middle" class="label" style="fill:#3e6b91">ResNet-18</text><text x="400.0" y="270" text-anchor="middle" class="small">Shared per camera</text><text x="400.0" y="294" text-anchor="middle" class="small">Current: 15 × 20*</text><text x="400.0" y="318" text-anchor="middle" class="small">Past: 4 × 4 / frame</text><rect x="540" y="205" width="190" height="136" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M541 241 H729" stroke="#3e6b91" stroke-opacity=".35"/><text x="635.0" y="230" text-anchor="middle" class="label" style="fill:#3e6b91">Visual tokens</text><text x="635.0" y="270" text-anchor="middle" class="small">Native spatial PE</text><text x="635.0" y="294" text-anchor="middle" class="small">Physical-time PE</text><text x="635.0" y="318" text-anchor="middle" class="small">History / camera masks</text><rect x="800" y="205" width="225" height="136" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M801 241 H1024" stroke="#3e6b91" stroke-opacity=".35"/><text x="912.5" y="230" text-anchor="middle" class="label" style="fill:#3e6b91">ACT encoder</text><text x="912.5" y="270" text-anchor="middle" class="small">4 layers · d = 512</text><text x="912.5" y="294" text-anchor="middle" class="small">8 heads · FFN 3200</text><text x="912.5" y="318" text-anchor="middle" class="small">Native core retained</text><path d="M260 274 H305" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M495 274 H540" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 274 H800" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="415" width="195" height="145" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M66 451 H259" stroke="#3e6b91" stroke-opacity=".35"/><text x="162.5" y="440" text-anchor="middle" class="label" style="fill:#3e6b91">K observed tracks</text><text x="162.5" y="480" text-anchor="middle" class="small">Current anchor xᵢ(0)</text><text x="162.5" y="504" text-anchor="middle" class="small">Past displacement Δxᵢ</text><text x="162.5" y="528" text-anchor="middle" class="small">Time + validity</text><rect x="305" y="415" width="225" height="145" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M306 451 H529" stroke="#247c74" stroke-opacity=".35"/><text x="417.5" y="440" text-anchor="middle" class="label" style="fill:#247c74">Point encoder</text><text x="417.5" y="480" text-anchor="middle" class="small">Shared MLP: 128 → 128</text><text x="417.5" y="504" text-anchor="middle" class="small">→ 128 → 512 (H = 16)</text><text x="417.5" y="528" text-anchor="middle" class="small">Aligned image features</text><rect x="575" y="415" width="155" height="122" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M576 451 H729" stroke="#3e6b91" stroke-opacity=".35"/><text x="652.5" y="440" text-anchor="middle" class="label" style="fill:#3e6b91">Robot state</text><text x="652.5" y="480" text-anchor="middle" class="small">Observed q₀ only</text><text x="652.5" y="504" text-anchor="middle" class="small">Train-only stats</text><path d="M260 487 H305" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M652 415 V376 H774 V310 H800" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="415" width="225" height="145" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M801 451 H1024" stroke="#247c74" stroke-opacity=".35"/><text x="912.5" y="440" text-anchor="middle" class="label" style="fill:#247c74">Gated point fusion</text><text x="912.5" y="480" text-anchor="middle" class="small">Q: ACT memory</text><text x="912.5" y="504" text-anchor="middle" class="small">K,V: point tokens</text><text x="912.5" y="528" text-anchor="middle" class="small">M′ = M + tanh(g) Attn</text><path d="M912 341 V415" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 487 H550 V578 H776 V487 H800" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M401 341 V397 H418 V415" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="455" y="387" text-anchor="start" class="small" style="fill:#657480">calibrated bilinear sample</text><text x="65" y="612" text-anchor="start" class="body">Point encoder is permutation-equivariant over identities.</text><text x="65" y="641" text-anchor="start" class="body">Stationary control keeps anchors, time, masks and architecture;</text><text x="65" y="670" text-anchor="start" class="body">only past displacement is set to zero, before image sampling.</text><text x="65" y="727" text-anchor="start" class="small" style="fill:#657480">* 480 × 640 input. Resolution, joints, actions and timing are task adapters.</text><text x="65" y="749" text-anchor="start" class="small" style="fill:#657480">  No 3NN prior, future GT input, object ID or rigid post-processing.</text><rect x="1115" y="126" width="290" height="135" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M1116 162 H1404" stroke="#3e6b91" stroke-opacity=".35"/><text x="1260.0" y="151" text-anchor="middle" class="label" style="fill:#3e6b91">(b) Policy interface</text><text x="1260.0" y="191" text-anchor="middle" class="small">Native ACT decoder · 1 layer</text><text x="1260.0" y="215" text-anchor="middle" class="small">100 learned action queries*</text><text x="1260.0" y="239" text-anchor="middle" class="small">Native linear action head</text><rect x="1460" y="126" width="290" height="135" rx="7" fill="white" stroke="#3e6b91" stroke-width="1.8"/><path d="M1461 162 H1749" stroke="#3e6b91" stroke-opacity=".35"/><text x="1605.0" y="151" text-anchor="middle" class="label" style="fill:#3e6b91">Action chunk</text><text x="1605.0" y="191" text-anchor="middle" class="small">â₀:₉₉ ∈ R¹⁰⁰ˣᴬ</text><text x="1605.0" y="215" text-anchor="middle" class="small">Lpolicy = masked L1 + 10 KL</text><text x="1605.0" y="239" text-anchor="middle" class="small">Validate final raw action MSE</text><path d="M1405 194 H1460" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025 452 H1085 V194 H1115" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><text x="1087" y="297" text-anchor="start" class="small" style="fill:#3e6b91">M′(z)</text><rect x="1115" y="350" width="290" height="143" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M1116 386 H1404" stroke="#247c74" stroke-opacity=".35"/><text x="1260.0" y="375" text-anchor="middle" class="label" style="fill:#247c74">(c) Dynamics interface</text><text x="1260.0" y="415" text-anchor="middle" class="small">XYZ + future-time queries</text><text x="1260.0" y="439" text-anchor="middle" class="small">Independent point cross-attn</text><text x="1260.0" y="463" text-anchor="middle" class="small">Given action tokens in head</text><rect x="1460" y="350" width="290" height="143" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M1461 386 H1749" stroke="#247c74" stroke-opacity=".35"/><text x="1605.0" y="375" text-anchor="middle" class="label" style="fill:#247c74">Future point motion</text><text x="1605.0" y="415" text-anchor="middle" class="small">Δx̂ᵢ(t), t &gt; 0</text><text x="1605.0" y="439" text-anchor="middle" class="small">Primary: point SmoothL1</text><text x="1605.0" y="463" text-anchor="middle" class="small">Evaluate EPE / moving EPE</text><path d="M1405 422 H1460" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025 487 H1085 V422 H1115" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><text x="1087" y="337" text-anchor="start" class="small" style="fill:#247c74">M′(0)</text><rect x="1140" y="535" width="240" height="102" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M1141 571 H1379" stroke="#247c74" stroke-opacity=".35"/><text x="1260.0" y="560" text-anchor="middle" class="label" style="fill:#247c74">Committed controls</text><text x="1260.0" y="600" text-anchor="middle" class="small">u₀:T + physical time</text><text x="1260.0" y="624" text-anchor="middle" class="small">Dynamics head only</text><path d="M1260 535 V493" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="697" width="290" height="134" rx="7" fill="white" stroke="#78638c" stroke-width="1.8"/><path d="M1116 733 H1404" stroke="#78638c" stroke-opacity=".35"/><text x="1260.0" y="722" text-anchor="middle" class="label" style="fill:#78638c">(d) Optional completion</text><text x="1260.0" y="762" text-anchor="middle" class="small">XYZ + past-time queries</text><text x="1260.0" y="786" text-anchor="middle" class="small">Separate point cross-attn</text><text x="1260.0" y="810" text-anchor="middle" class="small">Observed anchors; hidden past</text><rect x="1460" y="697" width="290" height="134" rx="7" fill="white" stroke="#78638c" stroke-width="1.8"/><path d="M1461 733 H1749" stroke="#78638c" stroke-opacity=".35"/><text x="1605.0" y="722" text-anchor="middle" class="label" style="fill:#78638c">Past point motion</text><text x="1605.0" y="762" text-anchor="middle" class="small">Δx̂ⱼ(t), t &lt; 0</text><text x="1605.0" y="786" text-anchor="middle" class="small">t = 0 excluded from target</text><text x="1605.0" y="810" text-anchor="middle" class="small">Default: auxiliary OFF</text><path d="M1405 763 H1460" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1025 524 H1085 V763 H1115" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1087" y="665" text-anchor="start" class="small" style="fill:#78638c">M′(0)</text><path d="M45 876 H1750" stroke="#cdd7de"/><text x="45" y="915" text-anchor="start" class="section">ACT parity</text><text x="45" y="950" text-anchor="start" class="small">Single-frame variant bypasses extensions.</text><text x="45" y="975" text-anchor="start" class="small">Same native weights, objective and action head.</text><text x="600" y="915" text-anchor="start" class="section">Posterior isolation</text><text x="600" y="950" text-anchor="start" class="small">Policy: z ~ q(z | q₀, a*) in training; z = 0 at test.</text><text x="600" y="975" text-anchor="start" class="small">Point heads re-encode observations with z = 0.</text><text x="1195" y="915" text-anchor="start" class="section">Auxiliary gradient control</text><text x="1195" y="950" text-anchor="start" class="small">Detached probe first; bounded sharing is optional.</text><text x="1195" y="975" text-anchor="start" class="small">Full-update shared aux / primary norm ≤ 0.1.</text><text x="45" y="1020" text-anchor="start" class="small" style="fill:#657480">Architecture implementation only · no new trained-model performance is claimed · * task-specific horizon</text></svg>