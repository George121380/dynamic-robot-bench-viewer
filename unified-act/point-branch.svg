<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="830" viewBox="0 0 1800 830"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#1c354b"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192c3b}.title{font-size:30px;font-weight:700}.section{font-size:21px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.math{font-family:Georgia,serif;font-style:italic}</style><text x="45" y="50" text-anchor="start" class="title">Inside the point branch</text><text x="45" y="85" text-anchor="start" class="body" style="fill:#657480">Causal, identity-preserving inputs; direct displacement prediction; no nearest-neighbor interpolation prior</text><rect x="45" y="160" width="290" height="185" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M46 196 H334" stroke="#247c74" stroke-opacity=".35"/><text x="190.0" y="185" text-anchor="middle" class="label" style="fill:#247c74">Per-point input</text><text x="190.0" y="225" text-anchor="middle" class="small">H = 16 history slots</text><text x="190.0" y="249" text-anchor="middle" class="small">[xᵢ(0)/0.5 m, Δxᵢ(t)/0.05 m,</text><text x="190.0" y="273" text-anchor="middle" class="small">t (seconds), valid] ∈ R¹⁶ˣ⁸</text><text x="190.0" y="297" text-anchor="middle" class="small">Invalid slots are zero; mask retained</text><rect x="390" y="160" width="270" height="185" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M391 196 H659" stroke="#247c74" stroke-opacity=".35"/><text x="525.0" y="185" text-anchor="middle" class="label" style="fill:#247c74">Shared temporal MLP</text><text x="525.0" y="225" text-anchor="middle" class="small">Flatten one point: R¹²⁸</text><text x="525.0" y="249" text-anchor="middle" class="small">Linear 128 → 128 → 128 → 512</text><text x="525.0" y="273" text-anchor="middle" class="small">ReLU between layers</text><text x="525.0" y="297" text-anchor="middle" class="small">99,072 parameters</text><rect x="715" y="160" width="270" height="185" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M716 196 H984" stroke="#247c74" stroke-opacity=".35"/><text x="850.0" y="185" text-anchor="middle" class="label" style="fill:#247c74">Image alignment</text><text x="850.0" y="225" text-anchor="middle" class="small">Project xᵢ(t) with K(t), E(t)</text><text x="850.0" y="249" text-anchor="middle" class="small">Bilinear feature sample</text><text x="850.0" y="273" text-anchor="middle" class="small">Mean valid views / times</text><text x="850.0" y="297" text-anchor="middle" class="small">Linear 512 → 512 + point MLP</text><rect x="1040" y="160" width="300" height="185" rx="7" fill="white" stroke="#247c74" stroke-width="1.8"/><path d="M1041 196 H1339" stroke="#247c74" stroke-opacity=".35"/><text x="1190.0" y="185" text-anchor="middle" class="label" style="fill:#247c74">Point → ACT conditioning</text><text x="1190.0" y="225" text-anchor="middle" class="small">Normalize memory and points</text><text x="1190.0" y="249" text-anchor="middle" class="small">8-head cross-attention</text><text x="1190.0" y="273" text-anchor="middle" class="small">Residual gate starts at 0.1</text><text x="1190.0" y="297" text-anchor="middle" class="small">Shared encoder gets gradients</text><path d="M335 250 H390" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 250 H715" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M985 250 H1040" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><text x="1390" y="212" text-anchor="start" class="body">K points have no learned</text><text x="1390" y="241" text-anchor="start" class="body">ID or order embedding.</text><text x="1390" y="270" text-anchor="start" class="body">Changing point order only</text><text x="1390" y="299" text-anchor="start" class="body">changes token order.</text><rect x="45" y="475" width="290" height="185" rx="7" fill="white" stroke="#78638c" stroke-width="1.8"/><path d="M46 511 H334" stroke="#78638c" stroke-opacity=".35"/><text x="190.0" y="500" text-anchor="middle" class="label" style="fill:#78638c">Query j at time τ</text><text x="190.0" y="540" text-anchor="middle" class="small">Current XYZ xⱼ(0)</text><text x="190.0" y="564" text-anchor="middle" class="small">Signed physical time τ</text><text x="190.0" y="588" text-anchor="middle" class="small">Past τ &lt; 0 / future τ &gt; 0</text><text x="190.0" y="612" text-anchor="middle" class="small">No hidden trajectory in query</text><rect x="390" y="475" width="270" height="185" rx="7" fill="white" stroke="#78638c" stroke-width="1.8"/><path d="M391 511 H659" stroke="#78638c" stroke-opacity=".35"/><text x="525.0" y="500" text-anchor="middle" class="label" style="fill:#78638c">Point decoder</text><text x="525.0" y="540" text-anchor="middle" class="small">Query MLP: 4 → 128 → 128</text><text x="525.0" y="564" text-anchor="middle" class="small">ACT memory: 512 → 128</text><text x="525.0" y="588" text-anchor="middle" class="small">4-head cross-attention</text><text x="525.0" y="612" text-anchor="middle" class="small">LN + FFN 128 → 512 → 128</text><rect x="715" y="475" width="270" height="185" rx="7" fill="white" stroke="#78638c" stroke-width="1.8"/><path d="M716 511 H984" stroke="#78638c" stroke-opacity=".35"/><text x="850.0" y="500" text-anchor="middle" class="label" style="fill:#78638c">Direct motion output</text><text x="850.0" y="540" text-anchor="middle" class="small">Linear 128 → 3</text><text x="850.0" y="564" text-anchor="middle" class="small">× 0.05 m</text><text x="850.0" y="588" text-anchor="middle" class="small">x̂ⱼ(τ) = xⱼ(0) + Δx̂ⱼ(τ)</text><text x="850.0" y="612" text-anchor="middle" class="small">No 3NN / rigid correction</text><path d="M335 567 H390" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 567 H715" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1190 345 V411 H525 V475" fill="none" stroke="#1c354b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="770" y="400" text-anchor="start" class="small" style="fill:#657480">ACT observation memory with z = 0</text><text x="1050" y="510" text-anchor="start" class="body">Dynamics and past completion use separate heads.</text><text x="1050" y="538" text-anchor="start" class="body">Each query attends to the same observed memory.</text><text x="1050" y="566" text-anchor="start" class="body">No query self-attention: query chunks preserve outputs.</text><text x="1050" y="594" text-anchor="start" class="body"></text><text x="1050" y="622" text-anchor="start" class="body">Only the dynamics head also reads committed actions.</text><text x="1050" y="650" text-anchor="start" class="body">Completion gradient is detached or explicitly norm-capped.</text><path d="M45 720 H1750" stroke="#cdd7de"/><text x="45" y="760" text-anchor="start" class="section">Controlled comparison: stationary tracks vs observed tracks</text><text x="45" y="800" text-anchor="start" class="body">Both branches use the same current anchors, timestamps, validity, visual backbone and parameter budget. Stationary XYZ is applied before image gathering.</text></svg>