 'd-attn1':{title:['物体注意力 第1层','Object attention block1'],dims:'20 × 12 × 256',note:['8头×32维；只沿物体交换','8heads×32;objects only'],type:'learned',code:'interaction_model.py · interactions[0]',detail:['同一未来时刻的12个对象交换信息，加入起点相对XYZ和距离。包含LayerNorm、Q/K/V、几何消息、残差相加、256→128→256内部计算；不与其他未来时刻交换信息。下方“注意力内部”画出细节。','Twelve objects exchange information at the same output time,with initial relative XYZ/distance.Includes LayerNorm,Q/K/V,geometry messages,residuals,and256→128→256 processing.No exchange across output times.See the expanded block below.']},
 'd-attn2':{title:['物体注意力 第2层','Object attention block2'],dims:'20 × 12 × 256',note:['再次交换；不是下一物理时刻','Another exchange,not the next physical time'],type:'learned',code:'interaction_model.py · interactions[1]',detail:['第二层使用第一层更新后的物体向量，拥有独立参数，但仍处在同一个输出时刻。相对位置仍来自原起点，不是第一层预测的新坐标。','Second block uses updated vectors from block1 with separate parameters,at the same output time.Geometry still comes from the original chunk boundary,not newly predicted coordinates.']},
 'd-ballhead':{title:['球输出层','Ball output head'],dims:'256 → 3 / t',note:['完整层：256→60','Stored head256→60'],type:'learned',slot:'headBall',code:'interaction_model.py · ball_output',detail:['完整60行按20时刻分成3行一组。第t个球向量只用对应3行，输出球心XYZ位移；不是在每个时刻再输出20帧。权重和偏置零初始化。','Sixty rows split into twenty3-row groups.Slot t uses its matching group for ball XYZ displacement.It does not output twenty frames again at each slot.Zero-initialized weights/biases.']},
 'd-pinhead':{title:['共享瓶输出层 ×10','Shared pin output head ×10'],dims:'256 → 6 / pin / t',note:['完整层256→120；十瓶共用','Stored256→120;shared by ten pins'],type:'learned',slot:'headPin',code:'interaction_model.py · pin_output',detail:['每时刻每瓶输出6维＝上端点XYZ＋下端点XYZ位移。120行按20时刻分组；十瓶共用同一组输出规则。输出不限定瓶长，也不使用中心／旋转重建端点。权重和偏置零初始化。','Six outputs per pin/time=two endpoint XYZ displacements.120 rows split by twenty times;all pins share the same head.No rigid-length constraint or center/rotation endpoint reconstruction.Zero-initialized weights/biases.']},
 'd-displacement':{title:['合并球与瓶端点位移','Merge ball and pin-endpoint displacements'],dims:'20 × 21 × 3',note:['不输出机器人未来坐标','No future robot-coordinate output'],type:'out',code:'interaction_model.py · displacement',detail:['球心1点，加十瓶各2端点，共21点。机器人向量参与条件计算，但没有机器人预测输出。','One ball center+two endpoints×ten pins=21 points.The robot vector conditions scene forecasts;there is no robot forecast head.']},
 'd-anchor':{title:['输入的当前场景','Original current scene'],dims:'21 × 3',note:['直接取scene_current','Read scene_current directly'],code:'interaction_model.py · return',detail:['原始当前21点直接用于位移转位置；不经过物体编码器，也不读取未来真值。','Original21 current points convert displacements to positions,without an object encoder or future truth.']},
 'd-output':{title:['⊕ 加回输入的当前场景坐标','⊕ Add original current-scene coordinates'],dims:'20 × 21 × 3',note:['位置＝当前坐标＋预测位移','Position=current+predicted displacement'],type:'out',code:'interaction_model.py · return',detail:['当前21个场景点加到20帧预测位移上。当前坐标直接从原输入读取；没有额外输出修正或真实接触开关。','Add the original21 current scene points to twenty displacement frames.No output correction or true-contact switch.']}
};
const LAYOUT={
C:[[['c-past',3],['c-plan',3]],[['c-past-map',3],['c-prefix',3]],[['c-h1',6]],[['c-h2',6]],[['c-h3',6]],[['c-head',6]],[['c-displacement',4],['c-anchor',2]],[['c-output',6]]],
D:[[['d-ball',2],['d-pin',2],['d-robot',2]],[['d-nodes',4],['d-prefix',2]],[['d-condition',6]],[['d-attn1',6]],[['d-attn2',6]],[['d-ballhead',2],['d-pinhead',4]],[['d-displacement',4],['d-anchor',2]],[['d-output',6]]]
};
const EDGES={C:[['c-past','c-past-map'],['c-plan','c-prefix','plan'],['c-past-map','c-h1'],['c-prefix','c-h1','plan'],['c-h1','c-h2'],['c-h2','c-h3'],['c-h3','c-head'],['c-head','c-displacement'],['c-displacement','c-output'],['c-anchor','c-output']],D:[['d-ball','d-nodes'],['d-pin','d-nodes'],['d-robot','d-nodes'],['d-nodes','d-condition'],['d-prefix','d-condition','plan'],['d-condition','d-attn1'],['d-attn1','d-attn2'],['d-attn2','d-ballhead'],['d-attn2','d-pinhead'],['d-ballhead','d-displacement'],['d-pinhead','d-displacement'],['d-displacement','d-output'],['d-anchor','d-output']]};
let lang='zh-CN',slot=5,view='both',selected='d-attn1',receiver=1;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nodeMarkup(id,span){const n=NODES[id],i=lang==='en'?1:0;return `<button type="button" class="node span${span} ${n.type||''} ${id===selected?'selected':''}" id="${id}" data-node="${id}" aria-pressed="${id===selected}"><strong>${esc(n.title[i])}</strong><span class="dims">${esc(n.dims)}</span><span class="note">${esc(n.note[i])}</span>${n.slot?`<span class="slot" data-slot="${n.slot}"></span>`:''}</button>`;}
function drawEdges(){for(const model of ['C','D']){const container=$('diagram-'+model);if(!container.getBoundingClientRect().width)continue;const rect=container.getBoundingClientRect(),svg=container.querySelector('svg');svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);let paths=`<defs><marker id="arrow-${model}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" style="fill:var(--line);stroke:none"/></marker><marker id="amber-${model}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" style="fill:var(--amber);stroke:none"/></marker></defs>`;for(const [from,to,kind] of EDGES[model]){const a=$(from).getBoundingClientRect(),b=$(to).getBoundingClientRect(),x1=a.x+a.width/2-rect.x,y1=a.bottom-rect.y,x2=b.x+b.width/2-rect.x,y2=b.top-rect.y,mid=(y1+y2)/2;if(model==='D'&&window.innerWidth<=650&&['d-ball','d-pin','d-robot'].includes(from)){const y=a.y+a.height/2-rect.y;paths+=`<path d="M${a.left-rect.x} ${y} H-5 V${y2-14} H${x2} V${y2-3}" marker-end="url(#arrow-D)"/>`;continue;}paths+=`<path class="${kind==='plan'?'plan-edge':''}" d="M${x1} ${y1} V${mid} H${x2} V${y2-3}" marker-end="url(#${kind==='plan'?'amber':'arrow'}-${model})"/>`;}svg.innerHTML=paths;}drawObjectEdges();}
function showDetails(){const n=NODES[selected],i=lang==='en'?1:0;$('detail-title').textContent=n.title[i];$('detail-text').textContent=n.detail[i];$('detail-code').textContent=n.code;document.querySelectorAll('[data-node]').forEach(b=>{b.classList.toggle('selected',b.dataset.node===selected);b.setAttribute('aria-pressed',String(b.dataset.node===selected));});}
function updateTime(){const c=COPY[lang];$('time-value').textContent=(slot/10).toFixed(1)+' s';$('time').value=slot;$('plan-strip').innerHTML=Array.from({length:20},(_,i)=>`<div class="plan-frame ${i<slot?'visible':''} ${i===slot-1?'current':''}" aria-label="${(i+1)/10}s ${i<slot?(lang==='en'?'visible':'可读'):(lang==='en'?'not visible':'不可读')}">${i+1}</div>`).join('');$('prefix-explanation').textContent=c.prefix(slot);document.querySelectorAll('[data-slot]').forEach(e=>{e.textContent=c[e.dataset.slot](slot);});}
function setView(v){view=v;if(v==='C'&&selected.startsWith('d-')){selected='c-h1';showDetails();}if(v==='D'&&selected.startsWith('c-')){selected='d-attn1';showDetails();}$('model-C').hidden=v==='D';$('model-D').hidden=v==='C';$('model-grid').classList.toggle('single',v!=='both');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));requestAnimationFrame(drawEdges);}
function objectNames(){const c=COPY[lang];return [c.ball,...Array.from({length:10},(_,i)=>c.pin+(i+1)),c.robot];}
function renderObjects(){const names=objectNames(),c=COPY[lang];$('receiver').innerHTML=names.map((n,i)=>`<option value="${i}" ${i===receiver?'selected':''}>${esc(n)}</option>`).join('');$('senders').innerHTML=names.map((n,i)=>`<div id="sender-${i}" class="sender ${i===11?'robot':''} ${i===receiver?'receiver':''}">${esc(n)}</div>`).join('');$('aggregate').textContent=c.receiver+' '+names[receiver]+' · 256';requestAnimationFrame(drawObjectEdges);}
function drawObjectEdges(){const field=$('object-field'),svg=field.querySelector('svg'),r=field.getBoundingClientRect(),b=$('aggregate').getBoundingClientRect();if(!r.width)return;svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);let s='<defs><marker id="obj-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" style="fill:var(--line);stroke:none"/></marker></defs>';const y=b.top-r.top,x=b.x+b.width/2-r.x;for(let i=0;i<12;i++){const a=$('sender-'+i).getBoundingClientRect(),ax=a.right-r.x,ay=a.y+a.height/2-r.top;s+=`<path d="M${ax} ${ay} H${ax+5} V${y-30} H${x} V${y-3}" marker-end="url(#obj-arrow)"/>`;}svg.innerHTML=s;}
function render(){const c=COPY[lang];document.documentElement.lang=lang;document.title=lang==='en'?'Bowling dynamics · Model architectures':'保龄球动力学 · 模型结构图';document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=c[e.dataset.i18n];});$('lang').textContent=lang==='en'?'中文':'English';$('input-list').innerHTML=c.inputs.map((a,i)=>`<div class="input ${i===4?'plan':''}"><strong>${esc(a[0])}</strong><code>${esc(a[1])}</code><div class="shape">${esc(a[2])}</div><p>${esc(a[3])}</p></div>`).join('');for(const m of ['C','D'])$('diagram-'+m).innerHTML='<svg class="connectors" aria-hidden="true"></svg>'+LAYOUT[m].map((row,i)=>`<div class="graph-row ${m==='D'&&i===0?'encoders':''}">${row.map(([id,span])=>nodeMarkup(id,span)).join('')}</div>`).join('');$('attention-steps').innerHTML=c.steps.map(([title,text])=>`<div class="attention-step"><div><strong>${esc(title)}</strong><p>${esc(text)}</p></div></div>`).join('');$('time-lanes').innerHTML=c.lanes.map(a=>`<div class="lane"><strong>${esc(a[0])}</strong><p>${esc(a[1])}</p><div class="lane-arrow">↓</div><em>${esc(a[2])}</em></div>`).join('');$('fact-grid').innerHTML=c.facts.map(a=>`<div class="fact"><strong>${esc(a[0])}</strong><p>${esc(a[1])}</p></div>`).join('');$('history-body').innerHTML=c.history.map(t=>`<p>${esc(t)}</p>`).join('');$('source-list').innerHTML=PROVENANCE.sources.map(s=>`<a href="${esc(s.url)}">${esc(s.name)}</a>`).join('');$('report-link').href=lang==='en'?'../technical-report/en.html':'../technical-report/';updateTime();showDetails();renderObjects();setView(view);}
$('time').addEventListener('input',e=>{slot=Number(e.target.value);updateTime();requestAnimationFrame(drawEdges);});$('lang').addEventListener('click',()=>{lang=lang==='en'?'zh-CN':'en';render();});$('print').addEventListener('click',()=>print());document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$('receiver').addEventListener('change',e=>{receiver=Number(e.target.value);renderObjects();});$('model-grid').addEventListener('click',e=>{const b=e.target.closest('[data-node]');if(b){selected=b.dataset.node;showDetails();$('inspector').classList.add('open');}});$('close-detail').addEventListener('click',()=>$('inspector').classList.remove('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')$('inspector').classList.remove('open');});window.addEventListener('resize',()=>requestAnimationFrame(drawEdges));window.addEventListener('beforeprint',drawEdges);window.addEventListener('afterprint',()=>requestAnimationFrame(drawEdges));new ResizeObserver(()=>requestAnimationFrame(drawEdges)).observe($('model-grid'));render();
</script>
