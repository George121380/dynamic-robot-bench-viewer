<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 960" width="1640" height="960" role="img" aria-label="4D MAE / B5 — implemented architecture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526977"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif} .node{cursor:pointer}.node:focus{outline:none}.node:focus rect,.node:hover rect{stroke-width:3}.edge{fill:none;stroke:#526977;stroke-width:2;marker-end:url(#arrow)} .label{fill:#526977;font-size:16px}.small{fill:#526977;font-size:15px}</style><rect width="1640" height="960" fill="white"/><text x="40" y="52" font-size="29" fill="#172c3b" font-weight="600" text-anchor="start">4D MAE / B5 — implemented architecture</text><text x="40" y="83" font-size="17" fill="#526977" font-weight="400" text-anchor="start">Current observations → shared HPT → action generation + auxiliary trajectory completion</text><text x="40" y="126" font-size="15" fill="#526977" font-weight="600" text-anchor="start">OBSERVATION INPUTS</text><text x="290" y="126" font-size="15" fill="#526977" font-weight="600" text-anchor="start">MODALITY ENCODING</text><text x="690" y="126" font-size="15" fill="#526977" font-weight="600" text-anchor="start">JOINT REPRESENTATION</text><text x="1040" y="126" font-size="15" fill="#526977" font-weight="600" text-anchor="start">CONTEXT &amp; GENERATIVE HEADS</text><g class="node " data-node="rgb" tabindex="0" role="button" aria-label="Current RGB"><rect x="40" y="170" width="210" height="110" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="58" y="201" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Current RGB</text><text x="58" y="231" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,V,3,Himg,Wimg]</text><text x="58" y="255" font-size="17" fill="#526977" font-weight="400" text-anchor="start">V=1 by default</text></g><g class="node " data-node="rgb" tabindex="0" role="button" aria-label="ResNet18 + RGB stem"><rect x="290" y="170" width="300" height="130" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="308" y="201" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">ResNet18 + RGB stem</text><text x="308" y="231" font-size="17" fill="#526977" font-weight="400" text-anchor="start">spatial features → MLP</text><text x="308" y="255" font-size="17" fill="#526977" font-weight="400" text-anchor="start">16-query cross-attention</text><text x="308" y="279" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,16,256]</text></g><g class="node " data-node="state" tabindex="0" role="button" aria-label="Current state"><rect x="40" y="350" width="210" height="110" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="58" y="381" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Current state</text><text x="58" y="411" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,18]</text><text x="58" y="435" font-size="17" fill="#526977" font-weight="400" text-anchor="start">train-set normalization</text></g><g class="node " data-node="state" tabindex="0" role="button" aria-label="State MLP + resampler"><rect x="290" y="350" width="300" height="110" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="308" y="381" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">State MLP + resampler</text><text x="308" y="411" font-size="17" fill="#526977" font-weight="400" text-anchor="start">16-query cross-attention</text><text x="308" y="435" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,16,256]</text></g><g class="node " data-node="history" tabindex="0" role="button" aria-label="C point history"><rect x="40" y="510" width="210" height="145" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="58" y="541" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">C point history</text><text x="58" y="571" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,C,16,3] + valid</text><text x="58" y="595" font-size="17" fill="#526977" font-weight="400" text-anchor="start">C=64 by default</text><text x="58" y="619" font-size="17" fill="#526977" font-weight="400" text-anchor="start">last frame = anchor</text></g><g class="node " data-node="tokenizer" tabindex="0" role="button" aria-label="Shared tokenizer Tθ"><rect x="290" y="510" width="300" height="145" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="308" y="541" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">Shared tokenizer Tθ</text><text x="308" y="571" font-size="17" fill="#526977" font-weight="400" text-anchor="start">anchor + 30 displacement slots</text><text x="308" y="595" font-size="17" fill="#526977" font-weight="400" text-anchor="start">+ missing / observed / noisy</text><text x="308" y="619" font-size="17" fill="#526977" font-weight="400" text-anchor="start">one token / point: [B,C,256]</text></g><g class="node " data-node="resampler" tabindex="0" role="button" aria-label="History resampler"><rect x="290" y="700" width="300" height="100" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="308" y="731" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">History resampler</text><text x="308" y="761" font-size="17" fill="#526977" font-weight="400" text-anchor="start">16 learned queries + point mask</text><text x="308" y="785" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,16,256]</text></g><g class="node " data-node="queries" tabindex="0" role="button" aria-label="Learned query tokens"><rect x="690" y="160" width="265" height="100" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="708" y="191" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Learned query tokens</text><text x="708" y="221" font-size="17" fill="#526977" font-weight="400" text-anchor="start">64 action + 16 future</text><text x="708" y="245" font-size="17" fill="#526977" font-weight="400" text-anchor="start">no target values</text></g><g class="node " data-node="hpt" tabindex="0" role="button" aria-label="HPT Transformer"><rect x="690" y="325" width="265" height="310" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="708" y="356" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">HPT Transformer</text><text x="708" y="386" font-size="17" fill="#526977" font-weight="400" text-anchor="start">128 tokens × 256 channels</text><text x="708" y="410" font-size="17" fill="#526977" font-weight="400" text-anchor="start">16 blocks · 8 heads</text><text x="708" y="434" font-size="17" fill="#526977" font-weight="400" text-anchor="start"></text><text x="708" y="458" font-size="17" fill="#526977" font-weight="400" text-anchor="start">64 action queries</text><text x="708" y="482" font-size="17" fill="#526977" font-weight="400" text-anchor="start">16 future queries</text><text x="708" y="506" font-size="17" fill="#526977" font-weight="400" text-anchor="start">16 RGB + 16 state</text><text x="708" y="530" font-size="17" fill="#526977" font-weight="400" text-anchor="start">+ 16 history tokens</text></g><g class="node " data-node="actionctx" tabindex="0" role="button" aria-label="Action context"><rect x="1040" y="165" width="220" height="100" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="1058" y="196" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Action context</text><text x="1058" y="226" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,64,256]</text></g><g class="node " data-node="action" tabindex="0" role="button" aria-label="Action FM head"><rect x="1320" y="165" width="280" height="145" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="1338" y="196" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Action FM head</text><text x="1338" y="226" font-size="17" fill="#526977" font-weight="400" text-anchor="start">6 CrossBlocks · width 128</text><text x="1338" y="250" font-size="17" fill="#526977" font-weight="400" text-anchor="start">4 heads · noisy [B,40,7]</text><text x="1338" y="274" font-size="17" fill="#526977" font-weight="400" text-anchor="start">+ flow time τ</text></g><g class="node " data-node="actionout" tabindex="0" role="button" aria-label="Action chunk"><rect x="1320" y="355" width="280" height="100" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="1338" y="386" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">Action chunk</text><text x="1338" y="416" font-size="17" fill="#526977" font-weight="400" text-anchor="start">50 Euler steps → [B,40,7]</text><text x="1338" y="440" font-size="17" fill="#526977" font-weight="400" text-anchor="start">native action units</text></g><g class="node aux" data-node="futurectx" tabindex="0" role="button" aria-label="Future context"><rect x="1040" y="510" width="220" height="100" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="1058" y="541" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Future context</text><text x="1058" y="571" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,16,256]</text></g><g class="node aux" data-node="decoder" tabindex="0" role="button" aria-label="Trajectory decoder Dφ"><rect x="1320" y="510" width="280" height="170" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="1338" y="541" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">Trajectory decoder Dφ</text><text x="1338" y="571" font-size="17" fill="#526977" font-weight="400" text-anchor="start">same Tθ + flow time MLP</text><text x="1338" y="595" font-size="17" fill="#526977" font-weight="400" text-anchor="start">4 CrossBlocks · width 256</text><text x="1338" y="619" font-size="17" fill="#526977" font-weight="400" text-anchor="start">4 heads · Linear(256→90)</text><text x="1338" y="643" font-size="17" fill="#526977" font-weight="400" text-anchor="start">same decoder called for C,Q</text></g><g class="node aux" data-node="cq" tabindex="0" role="button" aria-label="C / Q decoder inputs"><rect x="920" y="720" width="340" height="105" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="938" y="751" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">C / Q decoder inputs</text><text x="938" y="781" font-size="17" fill="#526977" font-weight="400" text-anchor="start">C: known past + noisy future</text><text x="938" y="805" font-size="17" fill="#526977" font-weight="400" text-anchor="start">Q: anchor + noisy past &amp; future</text></g><g class="node aux" data-node="tracks" tabindex="0" role="button" aria-label="Point displacements"><rect x="1320" y="710" width="280" height="120" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="1338" y="741" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">Point displacements</text><text x="1338" y="771" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,N,30,3]</text><text x="1338" y="795" font-size="17" fill="#526977" font-weight="400" text-anchor="start">50 Euler steps → metres</text><text x="1338" y="819" font-size="17" fill="#526977" font-weight="400" text-anchor="start">15 past + 15 future slots</text></g><path class="edge " d="M250 225 H290"/><path class="edge " d="M250 405 H290"/><path class="edge " d="M250 582 H290"/><path class="edge " d="M590 235 H635 V370 H690"/><path class="edge " d="M590 405 H655 V470 H690"/><path class="edge " d="M440 655 V700"/><path class="edge " d="M590 750 H650 V570 H690"/><path class="edge " d="M822 260 V325"/><path class="edge " d="M955 370 H1000 V215 H1040"/><path class="edge " d="M1260 215 H1320"/><path class="edge " d="M1460 310 V355"/><path class="edge aux" d="M955 560 H1040"/><path class="edge aux" d="M1260 560 H1320"/><path class="edge aux" d="M1260 770 H1290 V630 H1320"/><path class="edge aux" d="M1460 680 V710"/><text x="835" y="293" font-size="15" fill="#526977" font-weight="400" text-anchor="start">concat + pos.</text><text x="40" y="851" font-size="16" fill="#526977" font-weight="400" text-anchor="start">C = points with observed history; Q = extra query points with only current anchors supplied.</text><g class="aux" data-node="loss"><text x="40" y="894" font-size="23" fill="#087e83" font-weight="600" text-anchor="start">TRAINING   L = Laction + (LC-future + LQ-past + LQ-future) / 3</text></g><text x="40" y="936" font-size="14" fill="#526977" font-weight="400" text-anchor="start">Source: George121380/4dmae @ ef041c5  |  Full B5 defaults  |  CPU shape-verified; no task-performance claim</text></svg>