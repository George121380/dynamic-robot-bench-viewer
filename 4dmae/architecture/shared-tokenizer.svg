<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">4D MAE / B5: shared trajectory tokenizer</title><desc id="desc">A point anchor, flattened trajectory, and flattened three-state mask are linearly embedded and summed. The same tokenizer parameters are used in observation encoding and trajectory decoding. Decoder self-attention is over points, with each point token packing all 30 physical-time slots.</desc>
<defs>
<marker id="ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#252525"/></marker>
<marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#496fa4"/></marker>
<marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#ae7541"/></marker>
<marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#76618f"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif} path,line,rect,circle{vector-effect:non-scaling-stroke}</style>
<rect width="1600" height="900" fill="white"/>
<text x="40" y="48" font-size="31" fill="#252525" font-weight="600" text-anchor="start">B5: shared trajectory tokenizer</text>
<text x="40" y="102" font-size="23" fill="#252525" font-weight="600" text-anchor="start">(a) One trajectory → one point token</text>
<text x="40" y="171" font-size="22" fill="#252525" font-weight="600" text-anchor="start">Current anchor</text>
<text x="40" y="201" font-size="18" fill="#666666" font-weight="400" text-anchor="start">3 coordinates</text>
<path d="M360,175 L442,175" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<rect x="442" y="141" width="250" height="68" fill="white" stroke="#252525" stroke-width="1.5" rx="0"/>
<text x="567.0" y="182.0" font-size="22" fill="#252525" font-weight="600" text-anchor="middle">Linear 3 → 256</text>
<path d="M692,175 L767,175 L767,280 L795,280" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<text x="40" y="276" font-size="22" fill="#496fa4" font-weight="600" text-anchor="start">Displacement slots</text>
<text x="40" y="306" font-size="18" fill="#666666" font-weight="400" text-anchor="start">30 × 3; missing values = 0</text>
<path d="M360,280 L442,280" fill="none" stroke="#496fa4" stroke-width="1.5" marker-end="url(#blue)"/>
<rect x="442" y="246" width="250" height="68" fill="white" stroke="#496fa4" stroke-width="1.5" rx="0"/>
<text x="567.0" y="287.0" font-size="22" fill="#496fa4" font-weight="600" text-anchor="middle">Linear 90 → 256</text>
<path d="M692,280 L767,280 L767,280 L795,280" fill="none" stroke="#496fa4" stroke-width="1.5" marker-end="url(#blue)"/>
<text x="40" y="381" font-size="22" fill="#ae7541" font-weight="600" text-anchor="start">Slot status</text>
<text x="40" y="411" font-size="18" fill="#666666" font-weight="400" text-anchor="start">30 × 3 one-hot flags</text>
<path d="M360,385 L442,385" fill="none" stroke="#ae7541" stroke-width="1.5" marker-end="url(#orange)"/>
<rect x="442" y="351" width="250" height="68" fill="white" stroke="#ae7541" stroke-width="1.5" rx="0"/>
<text x="567.0" y="392.0" font-size="22" fill="#ae7541" font-weight="600" text-anchor="middle">Linear 90 → 256</text>
<path d="M692,385 L767,385 L767,280 L795,280" fill="none" stroke="#ae7541" stroke-width="1.5" marker-end="url(#orange)"/>
<circle cx="821" cy="280" r="23" fill="white" stroke="#252525" stroke-width="1.5"/>
<text x="821" y="289" font-size="30" fill="#252525" font-weight="400" text-anchor="middle">+</text>
<path d="M845,280 L900,280" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<rect x="900" y="220" width="255" height="120" fill="#f6f3fa" stroke="#76618f" stroke-width="1.5" rx="0"/>
<text x="1027" y="263" font-size="23" fill="#76618f" font-weight="600" text-anchor="middle">Tθ(anchor, Δ, status)</text>
<text x="1027" y="302" font-size="20" fill="#666666" font-weight="400" text-anchor="middle">256-dimensional token</text>
