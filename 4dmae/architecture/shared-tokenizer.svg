<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 960" width="1640" height="960" role="img" aria-label="What is shared — and what the decoder actually computes"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526977"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif} .node{cursor:pointer}.node:focus{outline:none}.node:focus rect,.node:hover rect{stroke-width:3}.edge{fill:none;stroke:#526977;stroke-width:2;marker-end:url(#arrow)} .label{fill:#526977;font-size:16px}.small{fill:#526977;font-size:15px}</style><rect width="1640" height="960" fill="white"/><text x="40" y="52" font-size="29" fill="#172c3b" font-weight="600" text-anchor="start">What is shared — and what the decoder actually computes</text><text x="40" y="83" font-size="17" fill="#526977" font-weight="400" text-anchor="start">B5 ties the trajectory tokenizer across observation encoding and both auxiliary decoding calls</text><text x="40" y="127" font-size="16" fill="#087e83" font-weight="600" text-anchor="start">1 / ONE POINT = ONE TOKEN</text><g class="node " data-node="tokenizer" tabindex="0" role="button" aria-label="Current anchor"><rect x="40" y="151" width="300" height="115" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="58" y="182" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Current anchor</text><text x="58" y="212" font-size="17" fill="#526977" font-weight="400" text-anchor="start">absolute XYZ [B,N,3]</text><text x="58" y="236" font-size="17" fill="#526977" font-weight="400" text-anchor="start">Linear(3→256)</text></g><g class="node " data-node="tokenizer" tabindex="0" role="button" aria-label="Relative displacement slots"><rect x="380" y="151" width="360" height="115" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="398" y="182" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Relative displacement slots</text><text x="398" y="212" font-size="17" fill="#526977" font-weight="400" text-anchor="start">15 past + 15 future; no current slot</text><text x="398" y="236" font-size="17" fill="#526977" font-weight="400" text-anchor="start">flatten 30×3 → Linear(90→256)</text></g><g class="node " data-node="tokenizer" tabindex="0" role="button" aria-label="Slot status"><rect x="780" y="151" width="360" height="115" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="798" y="182" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">Slot status</text><text x="798" y="212" font-size="17" fill="#526977" font-weight="400" text-anchor="start">one-hot(missing, observed, noisy)</text><text x="798" y="236" font-size="17" fill="#526977" font-weight="400" text-anchor="start">flatten 30×3 → Linear(90→256)</text></g><g class="node " data-node="tokenizer" tabindex="0" role="button" aria-label="Tθ = sum of projections"><rect x="1240" y="151" width="360" height="115" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="1258" y="182" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">Tθ = sum of projections</text><text x="1258" y="212" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,N,256]</text><text x="1258" y="236" font-size="17" fill="#526977" font-weight="400" text-anchor="start">same weights for all three uses</text></g><path class="edge " d="M190 266 V297 H1210 V209 H1240"/><path class="edge " d="M560 266 V297"/><path class="edge " d="M960 266 V297"/><text x="40" y="340" font-size="16" fill="#087e83" font-weight="600" text-anchor="start">2 / THREE USES OF THE SAME TOKENIZER</text><g class=""><text x="40" y="390" font-size="19" fill="#172c3b" font-weight="600" text-anchor="start">History → HPT</text><rect x="310" y="365" width="330" height="43" rx="5" fill="#eaf5f4" stroke="#9aabb4"/><text x="475.0" y="393" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">observed past</text><rect x="665" y="365" width="120" height="43" rx="5" fill="#ffffff" stroke="#9aabb4"/><text x="725.0" y="393" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">anchor</text><rect x="810" y="365" width="330" height="43" rx="5" fill="#f0f3f5" stroke="#9aabb4"/><text x="975.0" y="393" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">missing future</text><text x="1205" y="392" font-size="18" fill="#087e83" font-weight="400" text-anchor="start">16 history latents</text></g><g class="aux"><text x="40" y="452" font-size="19" fill="#172c3b" font-weight="600" text-anchor="start">C decoder call</text><rect x="310" y="427" width="330" height="43" rx="5" fill="#eaf5f4" stroke="#9aabb4"/><text x="475.0" y="455" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">observed past (clamped)</text><rect x="665" y="427" width="120" height="43" rx="5" fill="#ffffff" stroke="#9aabb4"/><text x="725.0" y="455" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">anchor</text><rect x="810" y="427" width="330" height="43" rx="5" fill="#f0f3f5" stroke="#9aabb4"/><text x="975.0" y="455" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">noisy future</text><text x="1205" y="454" font-size="18" fill="#087e83" font-weight="400" text-anchor="start">supervise C future</text></g><g class="aux"><text x="40" y="514" font-size="19" fill="#172c3b" font-weight="600" text-anchor="start">Q decoder call</text><rect x="310" y="489" width="330" height="43" rx="5" fill="#f0f3f5" stroke="#9aabb4"/><text x="475.0" y="517" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">noisy past</text><rect x="665" y="489" width="120" height="43" rx="5" fill="#ffffff" stroke="#9aabb4"/><text x="725.0" y="517" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">anchor</text><rect x="810" y="489" width="330" height="43" rx="5" fill="#f0f3f5" stroke="#9aabb4"/><text x="975.0" y="517" font-size="17" fill="#526977" font-weight="400" text-anchor="middle">noisy future</text><text x="1205" y="516" font-size="18" fill="#087e83" font-weight="400" text-anchor="start">supervise Q past + future</text></g><text x="40" y="582" font-size="16" fill="#087e83" font-weight="600" text-anchor="start">3 / SHARED TRAJECTORY DECODER Dφ — RUN ONCE FOR C AND ONCE FOR Q</text><g class="node aux" data-node="decoder" tabindex="0" role="button" aria-label="Query initialization"><rect x="40" y="615" width="300" height="150" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="58" y="646" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">Query initialization</text><text x="58" y="676" font-size="17" fill="#526977" font-weight="400" text-anchor="start">Tθ(anchor, xτ, status)</text><text x="58" y="700" font-size="17" fill="#526977" font-weight="400" text-anchor="start">+ time_mlp(sincos(τ))</text><text x="58" y="724" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,N,256]</text></g><g class="node aux" data-node="decoder" tabindex="0" role="button" aria-label="CrossBlock × 4"><rect x="400" y="615" width="900" height="150" rx="10" fill="#ffffff" stroke="#9aabb4" stroke-width="1.3"/><text x="418" y="646" font-size="20" fill="#172c3b" font-weight="600" text-anchor="start">CrossBlock × 4</text><text x="418" y="676" font-size="17" fill="#526977" font-weight="400" text-anchor="start">LayerNorm → self-attention among N point tokens → residual</text><text x="418" y="700" font-size="17" fill="#526977" font-weight="400" text-anchor="start">LayerNorm → cross-attention to 16 future-context tokens → residual</text><text x="418" y="724" font-size="17" fill="#526977" font-weight="400" text-anchor="start">LayerNorm → MLP → residual   |   hidden=256 · heads=4</text></g><g class="node aux" data-node="tracks" tabindex="0" role="button" aria-label="Velocity readout"><rect x="1360" y="615" width="240" height="150" rx="10" fill="#eaf5f4" stroke="#087e83" stroke-width="2"/><text x="1378" y="646" font-size="20" fill="#087e83" font-weight="600" text-anchor="start">Velocity readout</text><text x="1378" y="676" font-size="17" fill="#526977" font-weight="400" text-anchor="start">Linear(256→90)</text><text x="1378" y="700" font-size="17" fill="#526977" font-weight="400" text-anchor="start">[B,N,30,3]</text><text x="1378" y="724" font-size="17" fill="#526977" font-weight="400" text-anchor="start">all slots in parallel</text></g><path class="edge aux" d="M340 690 H400"/><path class="edge aux" d="M1300 690 H1360"/><g class="aux"><text x="40" y="820" font-size="21" fill="#172c3b" font-weight="600" text-anchor="start">TRAIN: xτ = (1−τ)xclean + τε   |   target: v = ε−xclean   |   τ ~ 0.999·Beta(1.5,1)+0.001</text><text x="40" y="862" font-size="19" fill="#526977" font-weight="400" text-anchor="start">SAMPLE: noise → 50 Euler steps → unnormalize to metres; re-clamp observed C past after every step</text><text x="40" y="898" font-size="17" fill="#526977" font-weight="400" text-anchor="start">τ is flow-matching time. Physical time is fixed by the data slots; current anchor is supplied separately.</text></g><text x="40" y="936" font-size="14" fill="#526977" font-weight="400" text-anchor="start">Source: George121380/4dmae @ ef041c5  |  Full B5 defaults  |  CPU shape-verified; no task-performance claim</text></svg>