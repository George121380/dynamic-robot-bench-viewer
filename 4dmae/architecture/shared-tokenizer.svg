<text x="651.0" y="709.0" font-size="21" fill="#ae7541" font-weight="600" text-anchor="middle">4 trajectory CrossBlocks</text>
<path d="M816,702 L867,702" fill="none" stroke="#ae7541" stroke-width="1.5" marker-end="url(#orange)"/>
<rect x="867" y="668" width="213" height="68" fill="white" stroke="#252525" stroke-width="1.5" rx="0"/>
<text x="973.5" y="709.0" font-size="20" fill="#252525" font-weight="600" text-anchor="middle">Linear 256 → 90</text>
<path d="M1080,702 L1135,702" fill="none" stroke="#ae7541" stroke-width="1.5" marker-end="url(#orange)"/>
<text x="1160" y="697" font-size="23" fill="#ae7541" font-weight="600" text-anchor="start">Velocity vτ</text>
<text x="1160" y="727" font-size="20" fill="#666666" font-weight="400" text-anchor="start">N × 30 × 3</text>
<text x="1390" y="633" font-size="18" fill="#ae7541" font-weight="400" text-anchor="middle">HPT future context</text>
<path d="M1390,642 L1390,650 L651,650 L651,668" fill="none" stroke="#ae7541" stroke-width="1.5" marker-end="url(#orange)"/>
<path d="M289,628 L289,668" fill="none" stroke="#76618f" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="161" y="650" font-size="17" fill="#76618f" font-weight="400" text-anchor="start">tied</text>
<path d="M201,645 L289,645" fill="none" stroke="#76618f" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="535" y="783" font-size="18" fill="#666666" font-weight="400" text-anchor="start">Self-attention over points → cross-attention to context → MLP</text>
<text x="40" y="850" font-size="20" fill="#252525" font-weight="400" text-anchor="start">Sampling: 50 Euler steps. Observed C past is clamped at every step.</text>
<text x="40" y="884" font-size="17" fill="#666666" font-weight="400" text-anchor="start">τ is generative time; the 30 output slots are physical time. Add the current anchor to recover absolute XYZ.</text>
</svg>