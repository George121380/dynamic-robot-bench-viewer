<rect x="397" y="560" width="214" height="68" fill="white" stroke="#252525" stroke-width="1.5" rx="0"/>
<text x="504.0" y="601.0" font-size="20" fill="#252525" font-weight="600" text-anchor="middle">Point resampler</text>
<path d="M611,594 L662,594" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<rect x="675" y="578" width="12" height="30" fill="#f2f2f2" stroke="#666666" stroke-width="1" rx="0"/>
<rect x="692" y="578" width="12" height="30" fill="#f2f2f2" stroke="#666666" stroke-width="1" rx="0"/>
<rect x="709" y="578" width="12" height="30" fill="#f2f2f2" stroke="#666666" stroke-width="1" rx="0"/>
<rect x="726" y="578" width="12" height="30" fill="#f2f2f2" stroke="#666666" stroke-width="1" rx="0"/>
<text x="808" y="600" font-size="20" fill="#252525" font-weight="400" text-anchor="start">16 history tokens → HPT</text>
<text x="40" y="698" font-size="20" fill="#252525" font-weight="600" text-anchor="start">Decoding</text>
<text x="40" y="728" font-size="19" fill="#666666" font-weight="400" text-anchor="start">C or Q</text>
<path d="M190,702 L231,702" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<rect x="231" y="668" width="117" height="68" fill="white" stroke="#76618f" stroke-width="1.5" rx="0"/>
<text x="289.5" y="709.0" font-size="24" fill="#76618f" font-weight="600" text-anchor="middle">Tθ</text>
<path d="M348,702 L395,702" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<circle cx="418" cy="702" r="20" fill="white" stroke="#252525" stroke-width="1.5"/>
<text x="418" y="710" font-size="26" fill="#252525" font-weight="400" text-anchor="middle">+</text>
<text x="418" y="783" font-size="18" fill="#666666" font-weight="400" text-anchor="middle">Flow time τ</text>
<path d="M418,763 L418,724" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<path d="M438,702 L486,702" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
