<rect x="1285" y="235" width="21" height="90" fill="#f3f0f7" stroke="#76618f" stroke-width="1" rx="0"/>
<rect x="1315" y="235" width="21" height="90" fill="#f3f0f7" stroke="#76618f" stroke-width="1" rx="0"/>
<rect x="1345" y="235" width="21" height="90" fill="#f3f0f7" stroke="#76618f" stroke-width="1" rx="0"/>
<rect x="1375" y="235" width="21" height="90" fill="#f3f0f7" stroke="#76618f" stroke-width="1" rx="0"/>
<text x="1304" y="362" font-size="22" fill="#76618f" font-weight="600" text-anchor="middle">N points × 256</text>
<text x="40" y="446" font-size="19" fill="#666666" font-weight="400" text-anchor="start">Status: missing / observed / noisy. All 30 time slots are packed into each point token.</text>
<path d="M40,480 L1560,480" fill="none" stroke="#d4d4d4" stroke-width="1"/>
<text x="40" y="526" font-size="23" fill="#252525" font-weight="600" text-anchor="start">(b) The same Tθ in both paths</text>
<text x="40" y="590" font-size="20" fill="#252525" font-weight="600" text-anchor="start">Observation</text>
<text x="40" y="620" font-size="19" fill="#666666" font-weight="400" text-anchor="start">C history</text>
<path d="M190,594 L231,594" fill="none" stroke="#252525" stroke-width="1.5" marker-end="url(#ink)"/>
<rect x="231" y="560" width="117" height="68" fill="white" stroke="#76618f" stroke-width="1.5" rx="0"/>
<text x="289.5" y="601.0" font-size="24" fill="#76618f" font-weight="600" text-anchor="middle">Tθ</text>
