<h1 data-zh="OCBench Bowling：重点看下游球瓶" data-en="OCBench Bowling: focus on downstream pins"></h1>
<p data-zh="建议作为 CollisionChain 之后优先追加的公开任务：球–瓶、瓶–瓶传播，接触解除、旋转倾倒与自由运动。首轮仍保留三个受控核心任务。" data-en="Priority public addition after CollisionChain: ball–pin and pin–pin propagation, contact release, tipping/rotation and free motion. Retain the three controlled core tasks initially."></p>
<p class="caption" data-zh="2026-10-12 · 实际 CPU smoke＋官方状态重渲染，不是模型成绩。其他 27 个任务仅列 Inventory，未做深度验收。" data-en="2026-10-12 · Actual CPU smoke and official-state rendering, not model results. Other 27 tasks are inventory only, with no depth acceptance."></p>
<h2 id="depth" data-zh="原轨迹可补深度，新采也已跑通" data-en="Original trajectories support depth rendering; live RGB-D works too"></h2>
<div class="grid"><figure><h3 data-zh="官方验证第一条：30 帧 RGB–depth" data-en="Official validation episode 0: 30 RGB–depth frames"></h3>
<a href="media/official-val-episode0-rgb-depth.gif"><img src="media/official-val-episode0-rgb-depth.gif" alt="Original Bowling qpos/qvel RGB and metric Z depth" loading="eager"></a>
<p class="depth" data-zh="真值深度：已原状态重渲染，单位米、Z-depth，无需模型估计。背景 far plane 已在 valid 中排除。" data-en="GT depth: original-state rendering, metres / camera-axis Z, without estimation. Far-plane background is excluded by valid masks."></p>
<figcaption data-zh="qpos/qvel 恢复后新渲染 RGB 和 depth 成对使用；均匀取 30 帧，约 3.33× 播放。原包没有 RGB／depth，未恢复原 MJWarp 接触。" data-en="New RGB and depth are paired after qpos/qvel restoration; 30 uniform frames, about 3.33× playback. Release lacks RGB/depth; original MJWarp contacts are unrecovered."></figcaption></figure>
<section><h3 data-zh="发布数据实际字段" data-en="Actual released data fields"></h3>
<p data-zh="10,000 train / 1,000 validation，500 controls／条。已确认 observations、actions、qpos、qvel；只读取第一条验证数值片段，约 1.80 MB，没有下载 3.47 GB 训练全库。" data-en="10,000 train / 1,000 validation, 500 controls each. Observations/actions/qpos/qvel verified; about 1.80 MB read for one validation prefix, not a 3.47 GB full train download."></p>
<p data-zh="官方没有 Bowling visual 数据包；没有 lite 版本。success 始终 false，按击倒瓶数／回报计分。CPU 通用采集脚本缺少 Bowling 路由，本项目使用 Bowling 专用入口。" data-en="No released visual Bowling data, and no lite. Success stays false: use knocked-pin count/return. The generic CPU collector lacks Bowling routing; our smoke uses a dedicated entry."></p>
<p data-zh="机器人为 UR5e＋Robotiq，7D joint delta，50 Hz；不同于 Panda Cartesian 7D。物理与 contact 500 Hz；本次 RGB-D 10 Hz。" data-en="UR5e + Robotiq, 7D joint deltas / 50 Hz, unlike Panda Cartesian 7D. Physics/contacts: 500 Hz; sample RGB-D: 10 Hz."></p>
<p class="caption" data-zh="软件首版 2026-10-04，不能称长期独立验证。公开 switch contact-buffer 问题不等于 Bowling 已坏；本次没有 GPU 验收。" data-en="Initial release 2026-10-04: long-term independent validation is unestablished. Reported switch contact-buffer issues do not establish Bowling failure; GPU was not tested here."></p>
<nav><a href="https://seohong.me/projects/ocbench/">Official project / videos</a><a href="https://huggingface.co/datasets/seohongpark/ocbench/tree/fd771640f7a47879d8b06657fe05389641b5bff9/full/bowling-task1-v0">Released Bowling data</a></nav></section></div>
<h2 data-zh="新采真实物理：RGB / 固定 XYZ / contact" data-en="Live physics: RGB / fixed XYZ / solver contacts"></h2>
<div class="grid" id="episodes"></div>
<p class="caption" data-zh="11 刚体 × 24 固定 body-local 点；回转误差 <4e−16 m。seed 0 的记录步进与上游 qpos/qvel/actions 逐步一致，重复 seed 一致。contact 为实时求解器标签，非距离近似；force 不作为 impulse。零分是自然负样本，未保证人为 Near Miss。" data-en="11 bodies × 24 fixed local points; roundtrip error <4e−16 m. Seed 0 stepping matches upstream qpos/qvel/actions exactly and repeats exactly. Contacts are live solver labels, not proximity estimates; force is not impulse. Zero scores are natural negatives, not guaranteed controlled Near Miss."></p>
<h2 data-zh="全套 OCBench Inventory：28 项" data-en="Full OCBench inventory: 28 tasks"></h2>
<p data-zh="其他任务的物理深度尚未验收。优先 Bowling，其次 chamber 的关节组合；block／hanoi 后续，switch 灯色规则不作为跨物体物理传播的核心验证。视频来自作者，均为 3× 播放。" data-en="Other tasks' depth paths remain unaccepted. Prioritize Bowling, then articulated chamber combinations; block/hanoi later. Switch color rules are not core physical-propagation tests. Author videos play at 3×."></p>

<h2 data-zh="进入模型迭代前待补" data-en="Before model iteration"></h2>
<p data-zh="训练 adapter、scene-family split、明确 OOD、严格 hidden velocity／action pairs 与共享评价仍待接。新采 model_visible／privileged 分离；未来动作必须预提交，不能用真实未来机器人轨迹。默认 state observation 含球速度，Hidden Velocity 实验需排除。" data-en="Training adapter, scene-family splits, explicit OOD, strict hidden-velocity/action pairs and shared evaluation remain pending. New visible/privileged fields are separated. Precommit future controls; do not use actual future robot trajectories. Remove true ball velocity from default state observations for Hidden Velocity."></p>
<p class="caption" data-zh="本次 GPU／模型训练未运行。Mac depth renderer 有精度警告；地面射线最大误差约 0.037 mm，不是全像素几何审计。原数值产物仅本机保存，公开页只含可视化与审计报告。" data-en="No GPU/model training run. macOS depth renderer emitted a precision warning; floor-ray maximum error about 0.037 mm is not a complete pixel audit. Raw arrays stay local; public content is media/audit reports."></p>
