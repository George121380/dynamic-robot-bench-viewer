<h1 data-zh="先用三个任务家族迭代模型" data-en="Start model iteration with three task families"></h1>
<p class="lead" data-zh="FreeMotion → Tool Contact/Release → CollisionChain：分别隔离自身历史、动作接触与跨物体传播。只选两个时，保留 FreeMotion + CollisionChain；Hook 与 Tool 共享实现，首轮不重复计数。"
data-en="FreeMotion → Tool Contact/Release → CollisionChain: isolate self history, action/contact and cross-object propagation. With two tasks, keep FreeMotion + CollisionChain. Hook shares the Tool implementation and is not a separate initial family."></p>
<p class="caption" data-zh="2026-10-11 复核 · 建议方案，不是已训练模型成绩 · 45 个具体条目，包含速度变体与离线数据集"
data-en="Reviewed 2026-10-11 · Recommendation, not trained-model performance · 45 individual entries, including speed variants and offline datasets"></p>

<section class="evidence">
<div><h3 data-zh="现有数据证明流程，并非完整训练集" data-en="Current samples validate the pipeline, not a complete training set"></h3>
<p data-zh="基础核心集 48 条／9 个 scene families，train/validation/test=42/0/6。独立参数碰撞链另有 12/6/0，工具与自由运动仍缺完整 split。39 个 depth 小样本／468 帧不能替代完整轨迹。"
data-en="Basic core: 48 episodes / 9 scene families, train/validation/test=42/0/6. Independent chain physics adds 12/6/0; Tool and FreeMotion still lack complete splits. The 39 depth samples / 468 frames cannot replace full rollouts."></p></div>
<div><h3 data-zh="上一轮结果：重建学会了，未来收益未稳定" data-en="Previous result: reconstruction learned, forecast gains inconsistent"></h3>
<p data-zh="旧 PullCubeTool pilot，三个训练 seed：验证选中模型 C3/B3 目标测试 ADE 为 0.405/0.397 mm；成对收益 −0.0085 mm，家族 95% CI [−0.0221,+0.0046]。新任务尚无模型成绩。"
data-en="Old PullCubeTool pilot, three training seeds: validation-selected C3/B3 target test ADE 0.405/0.397 mm; paired benefit −0.0085 mm, family 95% CI [−0.0221,+0.0046]. No model results on the new tasks."></p></div>
</section>

<section><h2 data-zh="下一轮实验建议（未执行）" data-en="Proposed next experiment (not executed)"></h2>
<p data-zh="每任务 100 个 scene families，4/6/6 模式约 1,600 条候选 rollout。先检查 family 划分覆盖，保留失败记录；所有同源模式／配对先分组，再切窗口。链先固定 independent-physics profile。"
data-en="100 scene families per task; 4/6/6 modes give about 1,600 candidate rollouts. Inspect family splits and retain failures; group related modes/pairs before windowing. Freeze the independent-physics chain profile first."></p>
<p data-zh="FreeMotion：H0/H-self；Chain：以 B/C 为目标，H-self/H-all 与上游历史 masking；最后比较 MAE。当前点、未来指令、模型规模和预算保持一致；报告 0.2/0.5/1.0 s、移动目标与接触阶段。"
data-en="FreeMotion: H0/H-self. Chain: target B/C with H-self/H-all and upstream-history masking. Compare MAE last. Share current queries, future commands, capacity and budget; report 0.2/0.5/1.0 s, moving targets and contact phases."></p>
<p class="caption" data-zh="待补：fresh held-out families、模型训练 adapter、同源 profile 分组、上游隐藏速度链式配对。严格 RGB-only 比较还要避免 H0 失去随机点身份定义。"
data-en="Pending: fresh held-out families, training adapter, related-profile grouping and matched upstream-hidden-velocity chain pairs. Strict RGB-only comparisons must also preserve random-point identity definitions for H0."></p></section>
<section><h2 data-zh="后续公开任务" data-en="Public tasks afterward"></h2>
<p data-zh="PushT 补旋转／力矩；PhysMani 先 moving-target pick 与 moving-button 的正常／高速；RoboCasa 先 OpenDrawer，再 CloseFridge。RoboCasa 原状态 RGB-D 已重放，持续 link 点与新接触标签仍未验收。"
data-en="PushT adds rotation/torque. PhysMani: normal/high-speed moving-target pick and moving-button. RoboCasa: OpenDrawer, then CloseFridge. Original-state RGB-D replay is accepted, but persistent link points/new contacts remain unverified."></p>
<p class="caption" data-zh="自定义协议小样本通过，不等于无隐藏 bug 或完整社区验证。PhysMani 全 16 任务合计 3,200 条发布 3DFA 评估是已发布快照；不是本轮训练或单任务数量。"
data-en="Small-sample custom-protocol acceptance does not establish absence of hidden bugs or full community validation. The 3,200 released-3DFA evaluations are a published snapshot aggregated over all 16 PhysMani tasks, not this review's training or per-task counts."></p>
